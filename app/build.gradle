plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.allen.max'
    compileSdk 35
    defaultConfig {
        applicationId "com.allen.max"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "3.0"

        // Read key from local.properties (local dev) or Environment Variable (CI)
        def localPropsFile = rootProject.file("local.properties")
        def geminiKey = ""
        if (localPropsFile.exists()) {
            def localProps = new java.util.Properties()
            localProps.load(new java.io.FileInputStream(localPropsFile))
            geminiKey = localProps.getProperty("gemini.api.key") ?: System.getenv("GEMINI_KEY") ?: "null"
        } else {
            geminiKey = System.getenv("GEMINI_KEY") ?: "null"
        }
        buildConfigField "String", "GEMINI_KEY", "\"${geminiKey}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}
dependencies {
    // Android 15 (API 35) compatible versions
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-service:2.8.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
