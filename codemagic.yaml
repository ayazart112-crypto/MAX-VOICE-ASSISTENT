workflows:
  android-release:
    name: MAX Voice Assistant APK
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Set Gradle permissions
        script: chmod +x gradlew
      - name: Build Debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
